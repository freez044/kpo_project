[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=44,<47",
    "argon2-cffi>=23,<26",
    "PyJWT>=2.9,<3",
    "email-validator>=2.2,<3",
    "tzdata",
    "alembic>=1.16",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=9.2.0",
    "testcontainers[postgres]>=4.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
